# ============================================================
# Test profile — used by @SpringBootTest integration tests
# ============================================================
# Replaces the PostgreSQL datasource with an H2 in-memory database.
# The application context starts with the real application code
# but writes to an isolated in-memory store that is created fresh
# for each test class and discarded afterwards.
#
# H2 PostgreSQL compatibility mode is enabled so H2 understands
# the same SQL dialect Spring Data JPA generates for PostgreSQL.
# ============================================================

spring.datasource.url=jdbc:h2:mem:back2kasi_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Suppress H2 console (not needed in tests)
spring.h2.console.enabled=false

# Use the same JWT settings as the local profile
# (overridden here to avoid requiring an application-local.properties secret)
# JWT config — same property names as application.properties
app.jwt.secret=test-secret-key-for-integration-tests-only-not-for-production-must-be-256-bits
app.jwt.expiration-ms=86400000

# Suppress noisy startup banners in test output
spring.main.banner-mode=off
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
