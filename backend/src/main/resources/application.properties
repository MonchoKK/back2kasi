# -------------------------------------------------------
# Back2Kasi Backend — Application Properties (Development)
# -------------------------------------------------------

spring.application.name=back2kasi-backend

# Server
server.port=8080

# DataSource — credentials come from environment variables or application-local.properties
# Set these env vars locally, or create src/main/resources/application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/back2kasi_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DevTools — trigger full restart (not just classloader reload)
spring.devtools.restart.enabled=true

# Active profile — set to 'local' during development to load application-local.properties
 spring.profiles.active=local

# -------------------------------------------------------
# JWT
# -------------------------------------------------------
# Secret key for signing tokens. In production, set the JWT_SECRET environment variable.
# The key must be at least 32 characters (256 bits) for HS256.
app.jwt.secret=${JWT_SECRET:back2kasi-local-dev-secret-please-change-in-production}

# Token lifetime — 24 hours in milliseconds (24 * 60 * 60 * 1000)
app.jwt.expiration-ms=86400000
