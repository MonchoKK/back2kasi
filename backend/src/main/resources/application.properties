# -------------------------------------------------------
# Back2Kasi Backend — Common Application Properties
# -------------------------------------------------------

spring.application.name=back2kasi-backend

# Server
server.port=8080

# Common DataSource Driver Settings
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Common JWT expiration (24 hours)
app.jwt.expiration-ms=86400000

# Default active profile. In production, override this by setting the SPRING_PROFILES_ACTIVE environment variable to 'prod'.
spring.profiles.active=dev
