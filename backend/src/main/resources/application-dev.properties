# -------------------------------------------------------
# Back2Kasi Backend — Development Profile (dev)
# -------------------------------------------------------

# DevTools — trigger full restart
spring.devtools.restart.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local Default Secret (never use in production!)
app.jwt.secret=back2kasi-local-dev-secret-please-change-in-production
